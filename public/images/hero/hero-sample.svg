<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#213d31" />
      <stop offset="100%" stop-color="#3a643b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf5ec" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#213d31" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Card Background -->
  <rect width="600" height="400" rx="24" fill="url(#heroBg)" />
  <circle cx="300" cy="200" r="180" fill="url(#glow)" />

  <!-- Herbal & Botanical Elements -->
  <g opacity="0.15" stroke="#fffdf3" stroke-width="2">
    <circle cx="120" cy="100" r="60" />
    <circle cx="480" cy="300" r="90" />
    <path d="M50 350 Q 150 250 250 350 T 450 350" fill="none" />
  </g>

  <!-- Central Clinical Telemedicine Illustration -->
  <g transform="translate(180, 80)">
    <!-- Doctor Shield -->
    <rect width="240" height="240" rx="20" fill="#fffdf3" />
    <circle cx="120" cy="90" r="42" fill="#eaf5ec" />
    
    <!-- Doctor Icon -->
    <path d="M120 70 A 18 18 0 1 0 120 106 A 18 18 0 1 0 120 70 Z" fill="#213d31" />
    <path d="M85 140 C85 118 100 112 120 112 C140 112 155 118 155 140 Z" fill="#213d31" />
    <path d="M112 124 L128 124 M120 116 L120 132" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

    <!-- Stethoscope Accent -->
    <path d="M102 120 C102 135 110 144 120 144 C130 144 138 135 138 120" stroke="#3a643b" stroke-width="2.5" fill="none" />
    <circle cx="120" cy="150" r="5" fill="#3a643b" />

    <!-- Badges -->
    <rect x="25" y="170" width="190" height="26" rx="6" fill="#f7fbf5" stroke="#3a643b" stroke-width="1" />
    <text x="120" y="187" text-anchor="middle" font-family="'Lato', sans-serif" font-size="11" font-weight="700" fill="#213d31">
      🌿 100% Certified Ayurvedic Vaidya
    </text>

    <rect x="35" y="204" width="170" height="20" rx="4" fill="#ecfdf5" />
    <text x="120" y="218" text-anchor="middle" font-family="'Lato', sans-serif" font-size="10" font-weight="600" fill="#065f46">
      ✓ Digital Prescription Included
    </text>
  </g>
</svg>
